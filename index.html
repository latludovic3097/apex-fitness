<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>APEX Fitness</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#E63946">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* Light theme inspired by Hevy / iOS — readable, large titles, subtle shadows */
:root{
  --bg:#f5f5f7;          /* page background (off-white) */
  --cd:#ffffff;           /* primary card background */
  --cd2:#f0f0f3;          /* secondary card / muted card */
  --bd:#e5e5ea;           /* borders */
  --tx:#1c1c1e;           /* primary text (near-black) */
  --t2:#48484a;           /* secondary text (dark gray, high contrast) */
  --mt:#8e8e93;           /* muted text (medium gray) */
  --ac:#E63946;           /* accent red (kept) */
  --ok:#2A9D8F;           /* success green */
  --wa:#F4A261;           /* warning orange */
  --in:#06b6d4;           /* info / cyan (Hevy-like active) */
  --ac10:rgba(230,57,70,.10);
  --ok10:rgba(42,157,143,.10);
  --wa10:rgba(244,162,97,.10);
  --in10:rgba(6,182,212,.10);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:75px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.hdr{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;font-weight:900;letter-spacing:5px;color:var(--ac)}
.stats-row{display:flex;gap:8px;padding:0 16px;margin-bottom:14px}
.stat-box{flex:1;background:var(--cd);border-radius:14px;padding:14px 10px;text-align:center;border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.stat-val{font-size:24px;font-weight:900}.stat-lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-top:3px;font-weight:600}
/* GROS titres de section — ce que le user a explicitement demandé */
.sec-title{padding:18px 16px 10px;font-size:22px;font-weight:900;letter-spacing:1px;color:var(--tx);text-transform:uppercase}
.card{background:var(--cd);border-radius:16px;border:1px solid var(--bd);padding:18px;margin:0 16px 12px;box-shadow:var(--shadow-sm)}
.sess-card{cursor:pointer;border-left:5px solid var(--ac);transition:transform .12s, box-shadow .12s}.sess-card:active{transform:scale(.985);box-shadow:var(--shadow-md)}
.sess-inner{display:flex;justify-content:space-between;align-items:center}
.sess-name{font-size:24px;font-weight:900;letter-spacing:3px}
.sess-meta{font-size:13px;color:var(--t2);margin-top:5px;font-weight:500}
.sess-muscles{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.muscle-tag{font-size:11px;padding:4px 10px;border-radius:10px;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:10px 0 14px;z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.04)}
.nav-btn{background:none;border:none;color:var(--mt);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 14px;font-family:inherit}
.nav-btn.active{color:var(--ac);font-weight:800}.nav-btn svg{width:22px;height:22px}
.btn{background:var(--ac);color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:15px;font-weight:800;cursor:pointer;width:100%;font-family:inherit;box-shadow:var(--shadow-sm);letter-spacing:.5px}.btn:active{opacity:.85;transform:scale(.99)}
.btn-ok{background:var(--ok)}.btn2{background:var(--cd2);color:var(--tx);border:1px solid var(--bd);border-radius:11px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.inp{background:#fff;border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:15px;width:100%;box-sizing:border-box;font-family:monospace;outline:none;font-weight:600}
.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(230,57,70,.12)}textarea.inp{resize:vertical;min-height:50px;font-family:inherit;font-weight:500}
.prog-bar{background:var(--bd);border-radius:4px;height:5px;margin-top:8px}.prog-fill{height:5px;border-radius:4px;transition:width .3s}
.pills{display:flex;gap:6px;padding:12px 16px;overflow-x:auto}
.pill{padding:7px 14px;border-radius:18px;border:1.5px solid var(--bd);background:var(--cd);color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}.pill.active{color:#fff;border-color:transparent}
.ex-imgs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:4px 0}
.ex-img-wrap{flex-shrink:0;width:135px;height:135px;border-radius:12px;overflow:hidden;border:1.5px solid var(--bd);background:var(--cd2);position:relative}
.ex-img-wrap img{width:100%;height:100%;object-fit:cover}
.ex-img-label{position:absolute;bottom:0;left:0;right:0;background:rgba(28,28,30,.85);color:#fff;font-size:11px;text-align:center;padding:3px;font-weight:700;letter-spacing:.5px}
.link-row{display:flex;gap:8px;margin-bottom:14px}
.ex-link{flex:1;display:flex;align-items:center;gap:7px;background:var(--cd2);border:1px solid var(--bd);border-radius:11px;padding:10px 12px;text-decoration:none;color:var(--tx);font-size:12px;font-weight:700}
.ex-link svg{width:20px;height:20px;flex-shrink:0}
.ex-name{font-size:20px;font-weight:900;letter-spacing:.3px}.ex-sets-info{font-size:14px;color:var(--t2);margin-top:5px;font-weight:600}
.ex-muscle-badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:8px;font-weight:700;margin-top:8px;text-transform:uppercase;letter-spacing:.5px}
.ex-notes{background:var(--ac10);border-radius:11px;padding:12px 16px;font-size:14px;color:var(--t2);margin-bottom:14px;line-height:1.55;border-left:3px solid var(--ac);font-weight:500}.ex-notes b{color:var(--tx);font-weight:700}
.sets-header{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:5px;margin-bottom:6px}
.sets-header span{font-size:11px;color:var(--mt);text-transform:uppercase;font-weight:600}
.set-row{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:5px;align-items:center;margin-bottom:5px}
.set-num{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.set-done{background:var(--ok10);color:var(--ok)}.set-empty{background:var(--cd2);color:var(--mt)}
.timer{background:var(--cd2);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;border:1.5px solid var(--bd);margin-top:12px}
.timer.done{border:2px solid var(--ok);background:var(--ok10)}
.timer-circle{position:relative;width:56px;height:56px;flex-shrink:0}
.timer-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;font-family:monospace}
.tbtn{border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.tbtn-go{background:var(--ok);color:#fff}.tbtn-pause{background:var(--ac);color:#fff}.tbtn-reset{background:var(--cd);color:var(--t2);border:1.5px solid var(--bd)}
.pr-line{margin-top:12px;font-size:13px;color:var(--t2);text-align:center;padding:10px;background:var(--cd2);border-radius:10px;font-weight:600}
.suggest-line{margin-top:10px;font-size:13px;text-align:center;padding:10px;background:rgba(69,123,157,.10);border-radius:10px;color:#3D6790;font-weight:700;border:1px solid rgba(69,123,157,.2)}
.ex-nav{display:flex;gap:10px;margin-top:18px}.ex-nav>*{flex:1}
.wu-card{border-bottom:1px solid var(--bd);padding:14px 0}.wu-card:last-child{border-bottom:none}
.wu-top{display:flex;gap:13px;align-items:flex-start}
.wu-img{width:70px;height:70px;border-radius:11px;overflow:hidden;flex-shrink:0;border:1.5px solid var(--bd);background:var(--cd2)}
.wu-img img{width:100%;height:100%;object-fit:cover}
.wu-links{display:flex;gap:7px;margin-top:7px}
.wu-links a{font-size:11px;text-decoration:none;padding:4px 9px;border-radius:7px;font-weight:700}
.wod-move{padding:10px 0;font-size:14px;display:flex;align-items:center;gap:11px;font-weight:600}.wod-move+.wod-move{border-top:1px solid var(--bd)}
.wod-img{width:44px;height:44px;border-radius:9px;overflow:hidden;border:1.5px solid var(--bd);background:var(--cd2);flex-shrink:0}
.wod-img img{width:100%;height:100%;object-fit:cover}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hist-exos{display:flex;flex-wrap:wrap;gap:5px}
.hist-exo{background:var(--cd2);border:1px solid var(--bd);border-radius:9px;padding:5px 10px;font-size:12px;color:var(--t2);font-weight:600}.hist-exo b{color:var(--tx);font-weight:800}
.hist-detail{margin-top:10px;font-size:12px;color:var(--t2);display:none}.hist-detail.open{display:block}
.hist-toggle{font-size:12px;color:var(--ac);cursor:pointer;margin-top:6px;background:none;border:none;font-family:inherit;text-decoration:underline;font-weight:600}
.phase-badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;font-weight:800;text-transform:uppercase;margin-left:8px;letter-spacing:.5px}
.fatigue-bar{height:9px;border-radius:5px;margin-top:6px;transition:width .3s}
.score-card{display:flex;gap:8px;margin-bottom:14px;padding:0 16px}
.score-item{flex:1;background:var(--cd);border-radius:14px;padding:14px 8px;text-align:center;border:1px solid var(--bd);box-shadow:var(--shadow-sm)}
.score-val{font-size:22px;font-weight:900}.score-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mt);margin-top:3px;font-weight:700}
.l5-alert{background:rgba(244,162,97,.10);border:1.5px solid var(--wa);border-radius:11px;padding:11px 14px;font-size:13px;color:#B97534;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-weight:600}
/* ─── Body map (anatomie Wikimedia + hotspots) ─── */
.bodymap-container{position:relative;max-width:520px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--bd)}
.bodymap-container img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.bodymap-hotspot{position:absolute;background:transparent;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background .15s, box-shadow .15s}
.bodymap-hotspot:hover{background:rgba(0,0,0,.04)}
.bodymap-hotspot.sel{background:rgba(230,57,70,.10);box-shadow:inset 0 0 0 2px var(--ac)}
.bodymap-dot{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bodymap-hotspot.sel .bodymap-dot{transform:scale(1.25);transition:transform .15s}
</style>
</head>
<body>
<div id="app"></div>

<!-- APEX Fitness v8.4 — modulaire + cloud sync.
     Ordre de chargement strict : core (purs) → data (immutable) → state (S + logic) → ui (rendu + actions + init).
     firebase-config.js est chargé AVANT sync.js (qui lit window.APEX_FIREBASE_CONFIG).
     sync.js est un module ES (defer auto) → s'exécute après les classics, dispatche apex:sync-ready. -->
<script src="core.js"></script>
<script src="data.js"></script>
<script src="anatomy.js"></script>
<script src="pathologies.js"></script>
<script src="achievements.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="firebase-config.js"></script>
<script type="module" src="sync.js"></script>

<!-- Service Worker : auto-update + toast -->
<script>
function showUpdateToast(reg){
  if(document.getElementById("updTst"))return;
  const t=document.createElement("div");
  t.id="updTst";
  t.setAttribute("role","status");
  t.style.cssText="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:90%;background:#E63946;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;gap:12px;font-family:-apple-system,'Segoe UI',sans-serif";
  t.innerHTML='✨ Nouvelle version disponible <span style="background:#fff;color:#E63946;padding:4px 10px;border-radius:8px;font-size:13px">Mettre à jour</span>';
  t.onclick=()=>{if(reg.waiting)reg.waiting.postMessage({type:"SKIP_WAITING"});};
  document.body.appendChild(t);
}
if("serviceWorker" in navigator){
  let reloading=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register("sw.js").then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller)showUpdateToast(reg);
    reg.addEventListener("updatefound",()=>{
      const sw=reg.installing;if(!sw)return;
      sw.addEventListener("statechange",()=>{
        if(sw.state==="installed"&&navigator.serviceWorker.controller)showUpdateToast(reg);
      });
    });
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{});});
  }).catch(()=>{});
}
</script>
</body>
</html>
